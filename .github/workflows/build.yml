name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev ccache
        pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.36

    - name: Initialize and Build
      run: |
        buildozer init
        sed -i 's/#requirements = python3,kivy/requirements = python3/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = telemetryagent/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.telemetry/' buildozer.spec
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Telemetry-APK
        path: bin/*.apk
        
